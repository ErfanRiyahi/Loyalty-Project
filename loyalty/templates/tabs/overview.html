<div class="tab-panel" id="tabDS">
  <div class="panel">
    <label for="dsDatasetAddress">مسیر فایل داده</label><input type="text" id="dsDatasetAddress" value="{{ defaults.standards.ARPU_CLV_GROWTH.path }}">
    <div class="profile-fields">
      <div><label for="dsDateColumn">ستون تاریخ</label><input type="text" id="dsDateColumn" list="profileColumnNames" placeholder="مثال: PaidDateUtc"></div>
      <div><label for="dsUsageColumn">ستون میزان مصرف</label><input type="text" id="dsUsageColumn" list="profileColumnNames" placeholder="مثال: OrderTotal"></div>
      <div><label for="dsUserColumn">ستون شناسه مشتری (اختیاری)</label><input type="text" id="dsUserColumn" list="profileColumnNames" placeholder="مثال: MSISDN"></div>
      <div><label for="dsFrequency">تجمیع میزان مصرف بر اساس</label><select id="dsFrequency"><option value="day">روز</option><option value="week">هفته</option><option value="month">ماه</option></select></div>
    </div>
    <datalist id="profileColumnNames"></datalist>
    <button class="run-btn" id="runDSBtn" type="button">بررسی داده‌ها</button>
  </div>
  <div id="dsStatusArea"></div><div id="dsResultsArea"></div>
</div>
